version: 2
updates:
  # Libraries and plugins in gradle/libs.versions.toml, and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
    ignore:
      # The latest stable Android Studio supports AGP 9.3 at most. Remove this once it supports
      # a newer one.
      - dependency-name: "com.android.application"
        versions: [">= 9.4"]
      - dependency-name: "com.android.library"
        versions: [">= 9.4"]
      - dependency-name: "com.android.tools.build:gradle"
        versions: [">= 9.4"]

  # The actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
