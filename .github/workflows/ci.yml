name: CI

on:
  # Pull requests are checked by the pull_request run. Running on every branch push as well
  # doubled the jobs per commit, and the parallel dependency downloads got rate limited by
  # Maven Central (HTTP 429).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 8.13 needs JDK 17+; the modules compile to Java 11 bytecode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, run unit tests and compile the benchmarks
        run: ./gradlew build test :benchmark:assembleReleaseAndroidTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # The library's instrumentation tests on an emulator: minSdk (Choreographer fallback), the
  # first API with frame metrics, and a current API with frame deadlines and GPU time.
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [21, 24, 34]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :framepulse:connectedDebugAndroidTest --console=plain

      - name: Upload instrumentation reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: framepulse/build/reports/androidTests/
